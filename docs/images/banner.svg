<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="ggml-rknpu2: llama.cpp on the Rockchip NPU">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2a45"/>
      <stop offset="1" stop-color="#142036"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1a2740" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#grid)" opacity="0.6"/>

  <!-- chip: pins, die, a 4x4 matrix where one row lights up as it is computed -->
  <g transform="translate(96 60)">
    <g fill="#3b4f73">
      <rect x="46" y="0" width="10" height="22" rx="3"/><rect x="78" y="0" width="10" height="22" rx="3"/>
      <rect x="110" y="0" width="10" height="22" rx="3"/><rect x="142" y="0" width="10" height="22" rx="3"/>
      <rect x="46" y="178" width="10" height="22" rx="3"/><rect x="78" y="178" width="10" height="22" rx="3"/>
      <rect x="110" y="178" width="10" height="22" rx="3"/><rect x="142" y="178" width="10" height="22" rx="3"/>
      <rect x="0" y="46" width="22" height="10" rx="3"/><rect x="0" y="78" width="22" height="10" rx="3"/>
      <rect x="0" y="110" width="22" height="10" rx="3"/><rect x="0" y="142" width="22" height="10" rx="3"/>
      <rect x="178" y="46" width="22" height="10" rx="3"/><rect x="178" y="78" width="22" height="10" rx="3"/>
      <rect x="178" y="110" width="22" height="10" rx="3"/><rect x="178" y="142" width="22" height="10" rx="3"/>
    </g>
    <rect x="20" y="20" width="160" height="160" rx="22" fill="url(#die)" stroke="#2f80ed" stroke-width="3"/>
    <g fill="#2a3b5c">
      <rect x="48" y="48" width="20" height="20" rx="4"/><rect x="78" y="48" width="20" height="20" rx="4"/>
      <rect x="108" y="48" width="20" height="20" rx="4"/><rect x="138" y="48" width="20" height="20" rx="4"/>
      <rect x="48" y="108" width="20" height="20" rx="4"/><rect x="78" y="108" width="20" height="20" rx="4"/>
      <rect x="108" y="108" width="20" height="20" rx="4"/><rect x="138" y="108" width="20" height="20" rx="4"/>
      <rect x="48" y="138" width="20" height="20" rx="4"/><rect x="78" y="138" width="20" height="20" rx="4"/>
      <rect x="108" y="138" width="20" height="20" rx="4"/><rect x="138" y="138" width="20" height="20" rx="4"/>
    </g>
    <g fill="#ff9f43">
      <rect x="48" y="78" width="20" height="20" rx="4"/><rect x="78" y="78" width="20" height="20" rx="4"/>
      <rect x="108" y="78" width="20" height="20" rx="4"/><rect x="138" y="78" width="20" height="20" rx="4"/>
    </g>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="360" y="148" fill="#f4f7fb" font-size="76" font-weight="700" letter-spacing="-1">ggml-rknpu2</text>
    <text x="362" y="200" fill="#a9b8d0" font-size="30">llama.cpp on the Rockchip NPU</text>
    <g font-size="20" font-weight="600" fill="#ff9f43" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
      <text x="362" y="252">RK3588 · RK3576 · RK3566 · RK3568 · RK3562</text>
    </g>
  </g>
</svg>
